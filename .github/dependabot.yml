version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  ignore:
       # Only allow for patch release upgrades
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
  cooldown:
      default-days: 7      # Quarantine: never a release published the same day   # Checks every week
  commit-message:
      prefix: "ci"         # Commit prefix: "ci: ..."