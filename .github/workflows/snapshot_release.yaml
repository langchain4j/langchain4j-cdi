# This workflow will build a package using Maven and then publish it to Maven Central when a release is created.
name: LangChain4J CDI Snapshot Release

# Only run on pushes to main.
on:
  workflow_dispatch:

jobs:
  snapshot_release:
    runs-on: ubuntu-latest
    environment: snapshot
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'
          server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
      - name: snapshot_release
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mvn -B -U --fail-at-end \
            -DperformRelease -DskipTests \
            clean deploy


